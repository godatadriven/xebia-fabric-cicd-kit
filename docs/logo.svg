<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="fabkit logo: a sheepdog guarding a woven shield">
  <defs>
    <linearGradient id="weave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#2FB57A"/>
    </linearGradient>
    <clipPath id="shield">
      <rect x="36" y="130" width="184" height="92" rx="18"/>
    </clipPath>
  </defs>

  <!-- Ears, tips folded forward -->
  <polygon points="74,96 82,52 112,60 116,84" fill="#1F2933"/>
  <polygon points="82,52 112,60 92,74" fill="#52606D"/>
  <polygon points="182,96 174,52 144,60 140,84" fill="#1F2933"/>
  <polygon points="174,52 144,60 164,74" fill="#52606D"/>

  <!-- Head -->
  <polygon points="72,136 78,92 104,68 152,68 178,92 184,136" fill="#1F2933"/>
  <polygon points="128,70 120,92 108,104 148,104 136,92" fill="#F5F7FA"/>
  <polygon points="108,102 148,102 158,136 98,136" fill="#F5F7FA"/>
  <ellipse cx="128" cy="113" rx="9" ry="6.5" fill="#1F2933"/>
  <path d="M120,124 Q128,130 136,124" fill="none" stroke="#1F2933" stroke-width="3" stroke-linecap="round"/>
  <circle cx="106" cy="92" r="6.5" fill="#1F2933" stroke="#F5F7FA" stroke-width="0"/>
  <circle cx="150" cy="92" r="6.5" fill="#1F2933"/>
  <circle cx="108" cy="90" r="2" fill="#F5F7FA"/>
  <circle cx="152" cy="90" r="2" fill="#F5F7FA"/>

  <!-- Woven shield -->
  <rect x="36" y="130" width="184" height="92" rx="18" fill="url(#weave)"/>
  <g clip-path="url(#shield)" fill="#FFFFFF">
    <polygon points="36,222 132,130 172,130 76,222" opacity="0.22"/>
    <polygon points="220,222 124,130 84,130 180,222" opacity="0.12"/>
  </g>

  <!-- Paws on the edge -->
  <rect x="84" y="122" width="28" height="17" rx="8.5" fill="#F5F7FA" stroke="#1F2933" stroke-width="3"/>
  <rect x="144" y="122" width="28" height="17" rx="8.5" fill="#F5F7FA" stroke="#1F2933" stroke-width="3"/>
</svg>
