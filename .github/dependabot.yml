version: 2
updates:
  - package-ecosystem: github-actions
    # The template's workflows are copied into new repositories
    directories: ["/", "/templates/fabric-repo"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
