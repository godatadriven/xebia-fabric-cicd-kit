name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Tag is on main and matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::${TAG} is not on main."; exit 1; }
          version=$(uv version --short)
          [[ "v${version}" == "${TAG}" ]] \
            || { echo "::error::${TAG} does not match pyproject version ${version}."; exit 1; }
      - name: Checks
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest -q --cov

  canary:
    needs: verify
    uses: ./.github/workflows/canary.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  publish:
    needs: canary
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
