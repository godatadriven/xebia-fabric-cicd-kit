[project]
name = "xebia-fabric-cicd-kit"
version = "0.1.0"
description = "Checks for Microsoft Fabric deployments with fabric-cicd."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fabric-cicd==1.4.0",
  "PyYAML>=6.0.3",
  "azure-identity>=1.19",
  "azure-storage-file-datalake>=12.25",
]

[project.scripts]
fabkit = "fabkit.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fabkit"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.15",
  "mypy>=1.18",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.coverage.run]
source = ["fabkit"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fabric_cicd.*", "azure.*"]
ignore_missing_imports = true
